<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Settings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .spinner-border-sm {
      width: 1rem;
      height: 1rem;
      border-width: 0.2em;
    }
    .loader-overlay {
	  position: fixed;
	  top: 0;
	  left: 0;
	  width: 100%;
	  height: 100%;
	  background-color: rgba(255, 255, 255, 0.8);
	  z-index: 9999;
	  display: flex;
	  justify-content: center;
	  align-items: center;
	}
  </style>
</head>
<body>
<div class="container mt-5">
  <h2 class="text-center mb-4">Account Settings ⚙️</h2>

  <!-- Profile Info -->
  <div class="card mb-4 shadow-sm">
    <div class="card-header"><b>Profile Information</b></div>
    <div class="card-body">
      <form id="profileForm">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" readonly>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
          <label for="mobile" class="form-label">Mobile Number</label>
          <input type="text" class="form-control" id="mobile" required>
        </div>
        <button type="submit" class="btn btn-primary" id="updateBtn">
          Update Profile
        </button>
      </form>
    </div>
  </div>

  <!-- Password Change -->
  <div class="card shadow-sm">
    <div class="card-header"><b>Change Password</b> &nbsp;  📌Set a strong password for security</div>
    <div class="card-body">
      <form id="passwordForm">
        <div class="mb-3">
          <label for="currentPassword" class="form-label">Current Password</label>
          <input type="password" class="form-control" id="currentPassword">
        </div>
        <div class="mb-3">
          <label for="newPassword" class="form-label">New Password</label>
          <input type="password" class="form-control" id="newPassword">
        </div>
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm New Password</label>
          <input type="password" class="form-control" id="confirmPassword">
        </div>
        <button type="submit" class="btn btn-warning" id="changePwdBtn">
          Change Password
        </button>
      </form>
    </div>
  </div>

  <!-- Loader (hidden by default) -->
  <div id="loader" class="loader-overlay d-none">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

</div>

<script>
  function showSweetAlert(title, text, icon = "success") {
    Swal.fire({
      title: title,
      text: text,
      icon: icon,
      confirmButtonColor: '#3085d6',
      confirmButtonText: 'OK',
	  allowOutsideClick: false
    });
  }

  document.addEventListener("DOMContentLoaded", function () {
    fetch("/users/current-user")
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          showSweetAlert("Session Expired", "Please login again.", "warning");
          window.location.href = "/login.html";
        } else {
          document.getElementById("username").value = data.username;
          document.getElementById("email").value = data.email;
          document.getElementById("mobile").value = data.mobile;
        }
      });

    document.getElementById("profileForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const mobile = document.getElementById("mobile").value.trim();
      const updateBtn = document.getElementById("updateBtn");

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const mobileRegex = /^[6-9]\d{9}$/;

      if (!emailRegex.test(email)) return showSweetAlert("Invalid Email", "Please enter a valid email address.", "error");
      if (!mobileRegex.test(mobile)) return showSweetAlert("Invalid Mobile", "Enter a valid 10-digit mobile number starting with 6-9.", "error");

      updateBtn.disabled = true;
      updateBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Updating...`;

      fetch("/users/update-profile", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, mobNo: mobile })
      })
        .then(res => res.text())
        .then(msg => showSweetAlert("Updated!", msg, "success"))
        .catch(() => showSweetAlert("Error", "Failed to update profile.", "error"))
        .finally(() => {
          updateBtn.disabled = false;
          updateBtn.innerHTML = "Update Profile";
        });
    });

    document.getElementById("passwordForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const currentPassword = document.getElementById("currentPassword").value.trim();
      const newPassword = document.getElementById("newPassword").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();
      const changePwdBtn = document.getElementById("changePwdBtn");

      if (!currentPassword || !newPassword || !confirmPassword) {
        return showSweetAlert("Incomplete Fields", "All password fields are required.", "error");
      }

      if (newPassword !== confirmPassword) {
        return showSweetAlert("Password Mismatch", "New passwords do not match.", "error");
      }

      changePwdBtn.disabled = true;
      changePwdBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Changing...`;

      fetch("/users/change-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ currentPassword, newPassword })
      })
        .then(res => res.text())
        .then(msg => {
			if (msg.toLowerCase().includes("success")) {
				showSweetAlert("Password Changed", msg, "success");
			} else {
			    showSweetAlert("Change Failed", msg, "error");
			}
		})
        .catch(() => showSweetAlert("Error", "Password change failed.", "error"))
        .finally(() => {
          changePwdBtn.disabled = false;
          changePwdBtn.innerHTML = "Change Password";
          document.getElementById("currentPassword").value = "";
          document.getElementById("newPassword").value = "";
          document.getElementById("confirmPassword").value = "";
        });
    });
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
