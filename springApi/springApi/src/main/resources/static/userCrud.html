<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User CRUD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background-color: #f7f9fc;
    }
    .card-custom {
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      border-radius: 15px;
    }
    .hero {
      background: linear-gradient(90deg, #4e73df, #1cc88a);
      color: white;
      padding: 2rem;
      border-radius: 1rem;
      text-align: center;
      margin-bottom: 2rem;
    }
    .loader-overlay {
	  position: fixed;
	  top: 0;
	  left: 0;
	  width: 100%;
	  height: 100%;
	  background-color: rgba(255, 255, 255, 0.8);
	  z-index: 9999;
	  display: flex;
	  justify-content: center;
	  align-items: center;
	}
  </style>
</head>
<body class="container py-4">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 rounded">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">UserManager</a>
    </div>
  </nav>

  <div class="hero">
    <h2 id="welcomeMessage">Welcome 👋</h2>
    <p>Manage users efficiently with below options</p>
  </div>


  <script>
	
	function capitalizeFirstLetter(str) {
	  if (!str) return '';
	  return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
	}
	
	document.addEventListener("DOMContentLoaded", function () {
	  fetch("/users/current-user")
	    .then(response => {
	      if (!response.ok) {
	        // If unauthorized or error, manually throw
	        throw new Error("User not found or session expired.");
	      }
	      return response.json();
	    })
	    .then(data => {
	      const welcomeElement = document.getElementById("welcomeMessage");
	      if (data.username) {
	        welcomeElement.innerText = `Welcome, ${data.username} 👋`;
	      } else {
	        welcomeElement.innerText = `Welcome 👋`;
	      }
	    })
	    .catch(error => {
	      console.error(error);
	      alert("Session expired. Please login again.");
	      window.location.href = "/login.html";
	    });
	});
	
	window.addEventListener("storage", function (event) {
	  if (event.key === "logout-event") {
	    window.close();
	  }
	});

    // Show loader before link clicks
    document.addEventListener("DOMContentLoaded", () => {
      const links = document.querySelectorAll("a:not([target='_blank'])");
      links.forEach(link => {
        link.addEventListener("click", function (e) {
          document.getElementById("loader").classList.remove("d-none");
        });
      });
    });

  // Hide loader when page fully loaded
  window.addEventListener("load", () => {
    document.getElementById("loader").classList.add("d-none");
  });

  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <div class="card card-custom p-4 mb-4">
    <h4>Add New User</h4>
    <form id="userForm" class="row g-3">
      <div class="col-md-5">
        <input type="text" id="name" class="form-control" placeholder="Name" required />
      </div>
      <div class="col-md-3">
        <input type="number" id="age" class="form-control" placeholder="Age" required />
      </div>
      <div class="col-md-4 text-end">
        <button type="submit" class="btn btn-primary">Add User</button>
      </div>
    </form>
  </div>

  <div class="row mb-3">
    <div class="col-md-6">
      <input type="text" id="searchInput" class="form-control" placeholder="Search by name..." oninput="loadUsers()" />
    </div>
    <div class="col-md-6 text-end">
      <button class="btn btn-outline-secondary" onclick="toggleSort()">Sort by Name</button>
    </div>
  </div>

  <div class="table-responsive card card-custom p-3">
    <table class="table table-hover">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Age</th>
          <th style="text-align: center;">Actions</th>
        </tr>
      </thead>
      <tbody id="userList"></tbody>
    </table>
  </div>

  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="toastMsg" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="toastBody">Message here</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <!-- Loader (hidden by default) -->
  <div id="loader" class="loader-overlay d-none">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
	let isAscending = true;
		
	    const form = document.getElementById('userForm');
	    const userList = document.getElementById('userList');
		
		function showAlert(message, type = 'success') {
		  const alertBox = document.getElementById('alertBox');
		  alertBox.className = `alert alert-${type}`;
		  alertBox.textContent = message;
		  alertBox.classList.remove('d-none');
		  setTimeout(() => alertBox.classList.add('d-none'), 3000);
		}


		form.addEventListener('submit', function (e) {
			e.preventDefault();
		  	const name = document.getElementById('name').value.trim();
		 	const age = parseInt(document.getElementById('age').value);

		  	if (!/^[a-zA-Z\s]+$/.test(name) || isNaN(age) || age <= 0) {
		      	showAlert('Please enter a valid name and a positive age.', 'danger');
		      	return;
		 	}
	 
			fetch('/users', {
			  method: 'POST',
			  headers: { 'Content-Type': 'application/json' },
			  body: JSON.stringify({ name, age })
			})
			.then(response => {
			  if (response.ok) {
			    showToast('User added successfully!');
			    loadUsers();
			    form.reset();
			  } else {
			    showToast('Failed to add user.', false);
			  }
			});
		});
		
		function showToast(message, isSuccess = true) {
		  const toastElement = document.getElementById('toastMsg');
		  const toastBody = document.getElementById('toastBody');

		  toastBody.textContent = message;
		  toastElement.classList.remove('text-bg-success', 'text-bg-danger');
		  toastElement.classList.add(isSuccess ? 'text-bg-success' : 'text-bg-danger');

		  const toast = new bootstrap.Toast(toastElement);
		  toast.show();
		}

		function loadUsers() {
		  fetch('/users')
		    .then(response => response.json())
			.then(users => {
			  console.log("Data from server:", users);

			  if (!Array.isArray(users)) {
			    throw new Error('Response is not an array!');
			  }

			  const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();

			  if (searchQuery) {
			    users = users.filter(user => user.name.toLowerCase().includes(searchQuery));
			  }

			  users.sort((a, b) => isAscending ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name));

			  const userList = document.getElementById("userList");
			  userList.innerHTML = '';

			  users.forEach(user => {
			    const row = document.createElement('tr');
			    row.innerHTML = `
			      <td>${user.name}</td>
			      <td>${user.age}</td>
			      <td Style="text-align: center;">
			        <button class="btn btn-sm btn-warning me-2" onclick="editUser('${user.id}', '${user.name}', ${user.age})">Edit</button>
			        <button class="btn btn-sm btn-danger" onclick="deleteUser('${user.id}', '${user.name}')">Delete</button>
			      </td>
			    `;
			    userList.appendChild(row);
			  });
			})
		    .catch(error => {
		      console.error('Error loading users:', error);
		      showToast('Error loading users!', false);
		    });
		}

		
		function toggleSort() {
		  isAscending = !isAscending;
		  loadUsers();
		}

		function deleteUser(id, name) {
          Swal.fire({
            title: `Are you sure?`,
            text: `You are about to delete ${name}. This cannot be undone!`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Yes, delete it!',
            cancelButtonText: 'Cancel'
          }).then((result) => {
            if (result.isConfirmed) {
                fetch('/users/' + id, {
                method: 'DELETE'
             }).then(response => {
                if (response.ok) {
                    showToast('User deleted!');
                    loadUsers();
                } else {
                    showToast('Error deleting user.', false);
                }
             });
            }
          });
		}

		function editUser(id, oldName, oldAge) {
		  const newName = prompt("Edit name for " + oldName + ":", oldName);
		  const newAge = prompt("Edit age for " + oldName + ":", oldAge);
		  
		  if (newName === null || newAge === null) {
		     showAlert('Edit cancelled by user.', 'warning');
		     return;
		   }
		  
		  const namePattern = /^[a-zA-Z\s]+$/;

          if (!namePattern.test(newName.trim()) || isNaN(newAge) || newAge <= 0) {
            showAlert('Please enter a valid name (letters only) and a positive age.', 'danger');
          }


		  if (newName && newAge) {	 
			fetch('/users/' + id, {
				method: 'PUT',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ name: newName, age: parseInt(newAge) })
		    }).then(response => {
		    	if (response.ok) {
		      		showToast('User updated!');
		      		loadUsers();
		    	} else {
					console.log("Editing user with ID:", id);
		      		showToast('Error updating user.', false);
		    	}
		  	});

		  }
		}

	    loadUsers(); 
  </script>
</body>
</html>
