<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>index-page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: linear-gradient(-45deg, #1a1a2e, #16213e, #0f3460, #533483);
      background-size: 400% 400%;
      animation: gradientBG 20s ease infinite;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .welcome-box {
      padding: 3rem;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
      text-align: center;
      z-index: 1;
    }

    h1.typewriter {
      font-size: 2rem;
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid rgba(255,255,255,0.75);
      width: 0;
      animation: typing 4s steps(40, end) forwards, blink 0.75s step-end infinite;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }

    @keyframes blink {
      50% { border-color: transparent }
    }

    .btn-glow {
      background: #00adb5;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 25px;
      font-size: 1.2rem;
      color: white;
      transition: 0.3s ease;
      box-shadow: 0 0 10px #00adb5, 0 0 40px #00adb5;
    }

    .btn-glow:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #00fff5, 0 0 50px #00fff5;
    }

    .signup-link {
      margin-top: 1rem;
      display: inline-block;
      color: #ffd369;
      text-decoration: none;
      font-weight: bold;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      filter: blur(50px);
      animation: moveBlobs 20s infinite ease-in-out alternate;
    }

    .blob:nth-child(1) {
      width: 400px; height: 400px;
      top: 5%; left: 10%;
    }

    .blob:nth-child(2) {
      width: 300px; height: 300px;
      bottom: 5%; right: 10%;
      animation-delay: 5s;
    }

    @keyframes moveBlobs {
      0%   { transform: translate(0, 0); }
      100% { transform: translate(50px, -30px); }
    }

	.loader-overlay {
	  position: fixed;
	  top: 0;
	  left: 0;
	  width: 100%;
	  height: 100%;
	  background-color: rgba(255, 255, 255, 0.8);
	  z-index: 9999;
	  display: flex;
	  justify-content: center;
	  align-items: center;
	}
	</style>
  
</head>
<body>

	<div class="blob"></div>
	<div class="blob"></div>
	
	<div class="welcome-box">
	  <h1 class="typewriter"><b>Welcome to the ART!</b></h1>
	  <p class="mt-3"><b>*artist: Rethish Kumar</b><br><br>This is a newly Created CRUD operation Project and i called this as an ART!<br> The main use of this art for creating a CRUD world. Aditionally, Hope it's a better Day!</p>
	  <button class="btn-glow mt-3" onclick="window.location.replace('/login.html')">Login</button>
	  <br><br>
	  <a href="/signup.html" target="blank" class="signup-link">Don't have an account? Sign Up</a>
	</div>

	<!-- Loader (hidden by default) -->
	<div id="loader" class="loader-overlay d-none">
		<div class="spinner-border text-primary" role="status">
			<span class="visually-hidden">Loading...</span>
		</div>
	</div>


</body>
</html>
