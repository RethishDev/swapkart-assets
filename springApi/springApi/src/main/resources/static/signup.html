<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<style>
	
		body {
		     background: #f8f9fa;
		     height: 100vh;
		     display: flex;
		     justify-content: center;
		     align-items: center;
		}
		.signup-box{
			width: 100%;
			max-width: 400px;
			padding: 2rem;
			background: #fff;
			border-radius: 20px;
			box-shadow: 0 5px 15px rgba(0,0,0,0.1);
		}
		.loader-overlay {
		  position: fixed;
		  top: 0;
		  left: 0;
		  width: 100%;
		  height: 100%;
		  background-color: rgba(255, 255, 255, 0.8);
		  z-index: 9999;
		  display: flex;
		  justify-content: center;
		  align-items: center;
		}
   </style>
</head>
<body class="container mt-5">
	<div class="signup-box">
	    <h2 class="mb-3 text-center">SignUp</h2>
	    <form id="signupForm">
			<div class="mb-3">
				<label for="username" class="form-label">Username</label>
	        	<input type="text" id="username" class="form-control" placeholder="example@: rethish..." required>
			</div>
			<div class="mb-3">	
				<label for="email" class="form-label">Email</label>
				<input type="text" id="email" class="form-control" placeholder="example@: rethish@gmail.com..." required>
			</div>
			<div class="mb-3">	
				<label for="mobNo" class="form-label">Mobile Number</label>
				<input type="text" id="mobNo" class="form-control" placeholder="example@: 8590362255..." required>
			</div>
			<div class="mb-3">
				<label for="password" class="form-label">Password 🙈</label>
	        	<input type="password" id="password" class="form-control" required>
			</div>
	        <button type="submit" class="btn btn-primary w-100">Signup</button>
	    </form>
	</div>


	<script>
		function showSweetAlert(title, text, icon = "success", confirmButtonText) {
		  Swal.fire({
			  title: 'Invalid Email',
			  text: 'Please enter a valid email address.',
			  icon: 'error',
			  showConfirmButton: true,
			  timer: 3000,
			  allowOutsideClick: false
			});

		}

       document.getElementById("signupForm").addEventListener("submit", function(e) {
			e.preventDefault();

			const username = document.getElementById("username").value;
			const password = document.getElementById("password").value;
			const email = document.getElementById("email").value;
			const mobile = document.getElementById("mobNo").value;

			const data = { username, password, email, mobNo: mobile };

			Swal.fire({
				title: 'Signing in...',
				text: 'Please wait a moment ⏳',
				allowOutsideClick: false,
				didOpen: () => Swal.showLoading()
			});

			const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
			const mobileRegex = /^[6-9]\d{9}$/;

			if (!emailRegex.test(email)) {
				return showSweetAlert("Invalid Email", "Please enter a valid email address.", "error");
				Swal.close();
			}

			if (!mobileRegex.test(mobile)) {
				return showSweetAlert("Invalid Mobile", "Enter a valid 10-digit mobile number starting with 6-9.", "error");
				Swal.close();
			}

			fetch('/auth/signup', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify(data)
			})
			.then(response => {
				if (!response.ok) throw new Error("Signup failed");
				Swal.close();
				return response.json();
			})
			.then(user => {
				console.log("Signed up and auto-logged in as:", user);
				localStorage.setItem("user", JSON.stringify(user));
				window.location.href = "/dashboard.html";
			})
			.catch(error => {
				Swal.close();
				showSweetAlert("Error", error.message, "error");
			});
		});

	</script>

</body>
</html>
