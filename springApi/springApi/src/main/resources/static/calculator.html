<html>
	<head>
		<title>calculation page</title>
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<style>
			body {
                background-color: blue;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                flex-direction: column;
            }

            h2 {
                color: red;
            }

            button {
                background-color: blue;
                color: yellow;
                border-radius: 15px;
                padding: 15px;
            }

            input {
            	border-radius: 15px;
                padding: 15px;
            }

            .calcBox {
                background:	grey;
                padding: 39px;
                border-radius: 15px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.2);
                text-align: center;
                max-width: 445px;
                width: 100%;
                margin-right: 150px;
            }
			 @media (max-width: 480px) {
			  .calcBox {
				padding: 20px;
			  }
			  h1 {
				font-size: 1.5rem;
			  }
			}
		</style>

		<script>

			function showSweetAlert(title, icon = "success") {
			    Swal.fire({
			      title: title,
			      icon: icon,
			      confirmButtonColor: 'Black',
			      confirmButtonText: 'OKAY',
				  allowOutsideClick: false
			    });
			}

			const submit = document.getElementById('submit');
			function selectOper() {

				event.preventDefault();

				const num1 = document.getElementById('num1').value;
				const num2 = document.getElementById('num2').value;
				const operation = document.getElementById('operation').value;

				if (num1 === "") {
					showSweetAlert("Please input first number", "warning");
				} else if (operation === "#") {
					showSweetAlert("You must select an operation! Remeber: I'am a Caluculator", "error");
				} else if (num2 === "") {
					showSweetAlert("Please input last number", "warning");
				} else {

					let result = "";
						const a = parseFloat(num1);
					    const b = parseFloat(num2);

					    switch (operation) {
					    	case "A":
						        result = a + b;
						        break;
					        case "B":
					        	result = a - b;
					            break;
					        case "C":
					            result = a * b;
					            break;
					        case "D":
					            result = b !== 0 ? a / b : "Cannot divide by zero";
					            break;
					    }

					   showSweetAlert("result is "+result, "success");
				}
			}

			function getSymbol(op) {
				switch (op) {
					case "A": return "+";
				    case "B": return "-";
				    case "C": return "×";
				    case "D": return "÷";
				    default: return "?";
				}
			}

		</script>

	</head>
	<body>
		<h1>Calculator <a style="color: green;">&nbsp;" + - * / "</a></h1>
		<br>

		<hr>
		<form id="submit" name="submit">
			<div class="calcBox">
				<marquee onmouseover="this.stop();" onmouseout="this.start();"><h3>You can perfom any Opertions here!</h3></marquee>
				<br><br><br>
				<label>Enter<b style="color: red;">first</b></label>
				<input type="number" id="num1" name="num1" placeholder="Number..." />
				<br><br>
				<select id="operation" name="operation">
					<option value="#">--Choose operation--</option>
					<option value="A">Addition</option>
					<option value="B">Subtraction</option>
					<option value="C">Multiplication</option>
					<option value="D">Division </option>
				</select>
				<br><br>
				<label>Enter<b style="color: red;">last</b></label>
				<input type="number" id="num2" name="num2" placeholder="Number..." />
				<br><br><br>
				<label>ClicK</label>
				<button type="submit" onclick="selectOper()">Me</button>
			</div>
		</form>

		<br><br><br><br><br>
		<h4>by Rethish KumaR</h4>
	</body>
</html>
