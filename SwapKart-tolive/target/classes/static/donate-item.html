<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Donate an Item | SwapKart</title>
    <link rel="stylesheet" href="css/items.css" />
    <style>
        body {
          font-family: 'Segoe UI', sans-serif;
          background-color: #f4f6f8;
          margin: 0;
        }

        header {
          background-color: #0c1b33;
          color: white;
          padding: 15px 30px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .logo {
          font-size: 24px;
          font-weight: bold;
        }

        nav a {
          color: white;
          margin-left: 20px;
          text-decoration: none;
          font-weight: 500;
        }

        nav a:hover {
          text-decoration: underline;
        }

        main {
          max-width: 700px;
          margin: 40px auto;
          padding: 30px;
          background-color: white;
          box-shadow: 0 0 12px rgba(0, 0, 0, 0.08);
          border-radius: 10px;
        }

        h2 {
          text-align: center;
          margin-bottom: 30px;
          color: #0c1b33;
        }

        form label {
          font-weight: 500;
          display: block;
          margin-top: 20px;
        }

        form input,
        form textarea {
          width: 100%;
          padding: 10px;
          margin-top: 5px;
          border: 1px solid #ccc;
          border-radius: 6px;
          font-size: 16px;
        }

        form textarea {
          resize: vertical;
          height: 100px;
        }

        .submit-btn {
          margin-top: 30px;
          background-color: #34a853;
          color: white;
          padding: 12px 20px;
          font-size: 16px;
          border: none;
          border-radius: 6px;
          cursor: pointer;
          width: 100%;
        }

        .submit-btn:hover {
          background-color: #2d8746;
        }

        footer {
          text-align: center;
          background-color: #0c1b33;
          color: white;
          padding: 15px;
          margin-top: 60px;
        }
    </style>
</head>
<body>

<!-- Header -->
<header>
    <div class="logo">SwapKart</div>
    <nav>
        <a href="items.html">Home</a>
        <a href="my-items.html">My Items</a>
        <a href="profile.html">My Profile</a>
        <a href="#" onclick="logout()">Logout</a>
    </nav>
</header>

<!-- Main Form -->
<main>
    <h2>Donate an Item</h2>
    <form id="donateForm">
        <label for="title">Item Title</label>
        <input type="text" id="title" name="title" placeholder="e.g., Children's Books" required />

        <label for="description">Description</label>
        <textarea id="description" name="description" placeholder="Describe the condition and purpose of the item" required></textarea>

        <label for="location">Location</label>
        <input type="text" id="location" name="location" placeholder="e.g., Coimbatore, Tamil Nadu" required />

        <label for="image">Upload Item Image</label>
        <input type="file" id="image" name="image" accept="image/*" />

        <button type="submit" class="submit-btn">Submit Donation</button>
    </form>
</main>

<!-- Footer -->
<footer>
    <p>© 2025 SwapKart. All rights reserved.</p>
</footer>

<script>
    function logout() {
      localStorage.removeItem('token');
      window.location.href = "/login.html";
    }

    document.getElementById('donateForm').addEventListener('submit', function (e) {
      e.preventDefault();
      alert("Donation submitted successfully!");
      // Connect to your backend endpoint if needed
    });
</script>

</body>
</html>
