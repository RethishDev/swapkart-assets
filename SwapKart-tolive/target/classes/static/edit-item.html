<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Item | SwapKart</title>
    <link rel="stylesheet" href="css/edit-item.css">
</head>
<body>
<header>
    <div class="logo">SwapKart</div>
    <nav>
        <a href="items.html">Browse</a>
        <a href="sell-item.html">Sell</a>
        <a href="my-items.html">My Listings</a>
        <a href="profile.html">Profile</a>
        <a href="logout.html">Logout</a>
    </nav>
</header>

<main class="form-container">
    <h2>Edit Item</h2>
    <form id="editItemForm">
        <label>Title:</label>
        <input type="text" id="title" required>

        <label>Price (₹):</label>
        <input type="number" id="price" required>

        <label>Category:</label>
        <input type="text" id="category" required>

        <label>Description:</label>
        <textarea id="description" rows="4" required></textarea>

        <label>Image URL:</label>
        <input type="text" id="imageUrl">

        <button type="submit" class="btn">Update Item</button>
    </form>
</main>

<footer>
    <p>© 2025 SwapKart. All rights reserved.</p>
</footer>

<script src="js/edit-item.js"></script>
</body>
</html>
