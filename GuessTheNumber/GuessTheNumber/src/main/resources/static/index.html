<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guess The Number Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      background: linear-gradient(to right, #ffecd2 0%, #fcb69f 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }
    .game-container {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 400px;
      width: 100%;
      display: none;
    }
    #message {
      font-size: 1.2rem;
      margin-top: 15px;
      font-weight: bold;
    }
    .dark {
      background: linear-gradient(to right, #232526, #414345);
      color: white;
    }
    .dark .game-container {
      background: #2c2c2c;
      color: white;
    }
    .dark table,
    .dark th,
    .dark td {
      background-color: #444 !important;
      color: white;
    }
    #mainMenu .btn-lg {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
	@keyframes pulseButton {
	  0% { transform: scale(1); background-color: #dc3545; }
	  50% { transform: scale(1.1); background-color: #ff4d4f; }
	  100% { transform: scale(1); background-color: #dc3545; }
	}

	.pulse {
	  animation: pulseButton 1s infinite;
	}

  </style>
</head>
<body>

<!-- 🌟 MAIN MENU -->
<div id="mainMenu" class="game-container">
  <h2>🎯 Guess The Number</h2>
  <p><b>by Rethish 😎</b></p>

  <div class="mb-3">
    <label><strong>👤 Player Name:</strong></label>
    <input type="text" id="playerNameInput" class="form-control" placeholder="Enter your name">
    <button class="btn btn-success mt-2" onclick="savePlayerName()">Save Profile</button>
  </div>

  <div class="mt-3">
    <button class="btn btn-warning btn-lg" onclick="startGame()">▶️ Play Game</button>
    <button class="btn btn-info mt-2" onclick="toggleLeaderboard(true)">📋 View Leaderboard</button>
  </div>

  <div class="mt-4">
    <h5>📘 Game Info</h5>
    <ul class="text-start">
      <li>Guess a number between X and Y based on difficulty</li>
      <li>Track time and number of tries</li>
      <li>Top 10 players shown on the leaderboard</li>
    </ul>
  </div>
</div>

<!-- 🎮 GAME UI -->
<div class="game-container" id="gameInterface">
  <p id="rangeMessage">Guess a number between 1 and 100</p>
  <div class="input-group mb-3">
    <input type="number" id="guessInput" class="form-control" placeholder="Enter your guess">
    <button class="btn btn-primary" onclick="submitGuess()">Guess</button>
  </div>

  <div id="message"></div>
  <button id="restartButton" class="btn btn-danger mt-3" onclick="restartGame()">Restart Game</button>

  <div class="mt-2">
    <p><strong>Your Tries:</strong> <span id="tries">0</span></p>
    <p><strong>⏱️ Time:</strong> <span id="timer">00:00</span></p>
    <p><strong>🏆 Best Score:</strong> <span id="bestScore">--</span></p>
  </div>

  <input type="hidden" id="difficulty" value="medium">
  
  <button class="mt-2 px-4 py-1 bg-secondary text-white rounded" onclick="returnToMainMenu()">🏠 Main Menu</button>

  <div class="flex justify-center mt-4">
    <button id="modeToggle" class="px-4 py-1 bg-dark text-white rounded" onclick="toggleTheme()">🌙 Toggle Dark Mode</button>
  </div>
</div>

<!-- 🏅 LEADERBOARD -->
<div id="leaderboardSection" style="display: none;" class="game-container">
  <h3 class="text-xl font-semibold text-center mb-2">🚩 Game Records</h3>
  <table class="w-full mt-2 border text-sm table table-bordered" id="leaderboard">
    <thead>
      <tr class="bg-gray-200">
        <th class="text-center">Rank</th>
        <th>Player</th>
        <th class="text-center">Score</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <button class="mt-2 px-4 py-1 bg-danger text-white rounded" onclick="clearLeaderboard()">🗑️ Clear Records</button>
  <button class="mt-2 px-4 py-1 bg-secondary text-white rounded" onclick="returnToMainMenu()">🏠 Main Menu</button>
</div>

<script>
  let tries = 0;
  let timerInterval;
  let secondsElapsed = 0;
  let gameOver = false;

  function savePlayerName() {
    const name = document.getElementById("playerNameInput").value.trim();
    if (name) {
      localStorage.setItem("playerName", name);
      alert("✅ Name saved! You're ready to play.");
    }
  }
  
  function start() {
      fetch('/api/guess/start', { method: 'POST' })
        .then(response => response.text())
        .then(data => {
          gameOver = false; // ✅ Enable guessing again

          document.getElementById("message").innerText = data;
          document.getElementById("guessInput").value = "";
          tries = 0;
          startTimer();
          updateScoreDisplay();

          const btn = document.getElementById("restartButton");
          btn.classList.remove("pulse");
          btn.innerText = "Restart Game";
        });
    }

	function startGame() {
	  const name = localStorage.getItem("playerName");
	  if (!name) {
	    Swal.fire("⚠️ Please enter your name first!");
	    return;
	  }

	  Swal.fire({
	    title: "🎮 Select Difficulty",
	    input: "select",
	    inputOptions: {
	      easy: "Easy (1 - 50)",
	      medium: "Medium (1 - 100)",
	      hard: "Hard (1 - 200)"
	    },
	    inputPlaceholder: "Select difficulty",
	    confirmButtonText: "Start Game",
	    showCancelButton: true,
	    inputValidator: (value) => {
	      if (!value) {
	        return "You need to choose a difficulty!";
	      }
	    }
	  }).then((result) => {
	    if (result.isConfirmed) {
	      const level = result.value;
	      let min = 1, max = 100;
	      if (level === "easy") max = 50;
	      else if (level === "hard") max = 200;

	      document.getElementById("difficulty").value = level;
	      document.getElementById("rangeMessage").innerText = `Guess a number between ${min} and ${max}`;

	      fetch(`/api/guess/set-range?min=${min}&max=${max}`, { method: 'POST' });

	      document.getElementById("mainMenu").style.display = "none";
	      document.getElementById("gameInterface").style.display = "block";
	      document.getElementById("leaderboardSection").style.display = "none";

	      start(); // your game logic start function
	    }
	  });
	}

  function returnToMainMenu() {
    document.getElementById("mainMenu").style.display = "block";
    document.getElementById("gameInterface").style.display = "none";
    document.getElementById("leaderboardSection").style.display = "none";
  }

  function submitGuess() {
    if (gameOver) {
      document.getElementById("message").innerText = "✅ You already won! Please restart the game.";
      return;
    }

    const number = document.getElementById("guessInput").value;
    const messageDiv = document.getElementById("message");

    if (!number) return;

    fetch(`/api/guess?number=${number}`, { method: 'POST' })
      .then(response => response.text())
      .then(data => {
        messageDiv.innerText = data;
        document.getElementById("guessInput").value = "";
        tries++;

        if (data.includes("Correct")) {
          gameOver = true; // ⛔ Disable further guesses
          stopTimer();
          animateRestartButton();

          const name = localStorage.getItem("playerName") || "Player";
          const best = localStorage.getItem("bestScore");
          if (!best || tries < parseInt(best)) {
            localStorage.setItem("bestScore", tries);
          }

          confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });

          // Save to leaderboard
          const leaderboard = JSON.parse(localStorage.getItem("leaderboard") || "[]");
          leaderboard.push({ name, score: tries, time: formatTime(secondsElapsed) });
          leaderboard.sort((a, b) => a.score - b.score);
          if (leaderboard.length > 10) leaderboard.pop();
          localStorage.setItem("leaderboard", JSON.stringify(leaderboard));
          loadLeaderboard();
        }

        updateScoreDisplay();
      });
  }
  
  function animateRestartButton() {
    const btn = document.getElementById("restartButton");
    btn.classList.add("pulse");
    btn.innerText = "🎮 Press Me to Play Again!";
  }

  function restartGame() {
    fetch('/api/guess/restart', { method: 'POST' })
      .then(response => response.text())
      .then(data => {
        gameOver = false; // ✅ Enable guessing again

        document.getElementById("message").innerText = data;
        document.getElementById("guessInput").value = "";
        tries = 0;
        startTimer();
        updateScoreDisplay();

        const btn = document.getElementById("restartButton");
        btn.classList.remove("pulse");
        btn.innerText = "Restart Game";
      });
  }

  function toggleLeaderboard(fromMain = false) {
    const section = document.getElementById("leaderboardSection");
    const gameSection = document.getElementById("gameInterface");
    if (section.style.display === "none") {
      section.style.display = "block";
      gameSection.style.display = "none";
      document.getElementById("mainMenu").style.display = "none";
    } else {
      section.style.display = "none";
      if (!fromMain) gameSection.style.display = "block";
    }
    loadLeaderboard();
  }

  function clearLeaderboard() {
    if (confirm("Are you sure you want to clear the leaderboard?")) {
      localStorage.removeItem("leaderboard");
      loadLeaderboard();
    }
  }

  function updateScoreDisplay() {
    document.getElementById("tries").innerText = tries;
    const best = localStorage.getItem("bestScore");
    document.getElementById("bestScore").innerText = best ? best : "--";
  }

  function loadLeaderboard() {
    const leaderboard = JSON.parse(localStorage.getItem("leaderboard") || "[]");
    leaderboard.sort((a, b) => a.score - b.score);
    const tbody = document.querySelector("#leaderboard tbody");
    tbody.innerHTML = "";

    leaderboard.slice(0, 10).forEach((entry, index) => {
      let badge = index + 1;
      if (index === 0) badge = "🥇";
      else if (index === 1) badge = "🥈";
      else if (index === 2) badge = "🥉";
      const row = `<tr>
        <td class="text-center">${badge}</td>
        <td>${entry.name}</td>
        <td class="text-center">${entry.score}</td>
      </tr>`;
      tbody.innerHTML += row;
    });
  }

  function toggleTheme() {
    document.body.classList.toggle("dark");
    const isDark = document.body.classList.contains("dark");
    localStorage.setItem("theme", isDark ? "dark" : "light");
  }

  function startTimer() {
    clearInterval(timerInterval);
    secondsElapsed = 0;
    timerInterval = setInterval(() => {
      secondsElapsed++;
      document.getElementById("timer").innerText = formatTime(secondsElapsed);
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
  }

  function formatTime(seconds) {
    const min = String(Math.floor(seconds / 60)).padStart(2, '0');
    const sec = String(seconds % 60).padStart(2, '0');
    return `${min}:${sec}`;
  }

  window.addEventListener("DOMContentLoaded", () => {
    const theme = localStorage.getItem("theme");
    if (theme === "dark") document.body.classList.add("dark");

    updateScoreDisplay();
    loadLeaderboard();

    document.getElementById("gameInterface").style.display = "none";
    document.getElementById("leaderboardSection").style.display = "none";
    document.getElementById("mainMenu").style.display = "block";

    const storedName = localStorage.getItem("playerName");
    if (storedName) document.getElementById("playerNameInput").value = storedName;
  });
</script>
</body>
</html>
